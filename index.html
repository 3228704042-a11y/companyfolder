<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>打开公司文件夹</title>

<style>
body{
    font-family:Segoe UI,Arial,sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    margin:0;
    background:#f5f6f8;
}
.card{
    background:#fff;
    padding:28px;
    border-radius:14px;
    box-shadow:0 8px 30px rgba(0,0,0,.08);
    text-align:center;
    max-width:460px;
    width:calc(100% - 40px);
}
button{
    font-size:18px;
    padding:12px 22px;
    border:0;
    border-radius:9px;
    cursor:pointer;
}
p{
    color:#666;
    line-height:1.6;
}
</style>
</head>

<body>

<div class="card">
    <h2>正在打开公司公共盘</h2>
    <p id="msg">正在处理……</p>

    <button onclick="openFolder()">
        如果没有自动打开，请点这里
    </button>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const id = params.get("id") || "";

function openFolder() {
    if (!id) {
        document.getElementById("msg").textContent = "没有读取到产品编号";
        return;
    }

    document.getElementById("msg").textContent = "正在打开：" + id;

    location.replace(
        "companyfolder://" + encodeURIComponent(id)
    );
}

if (id) {
    openFolder();
} else {
    document.getElementById("msg").textContent = "链接中没有产品编号";
}
</script>

</body>
</html>
